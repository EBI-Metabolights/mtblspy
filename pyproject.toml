[project]
name = "mtblspy"
version = "0.1.1"
description = "MetaboLights Submission CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "requests>=2.31.0",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
    "keyring>=25.0.0",
    "tqdm>=4.66.0",
    "pre-commit>=4.7.0",
]

[project.scripts]
mtbls = "mtblspy.commands.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mtblspy"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "commitizen>=4.19.2",
    "pytest>=8.0.0",
    "ruff>=0.2.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version = "1.0.0"
tag_format = "v$major.$minor.$patch"
version_files = [
    "pyproject.toml:version",
    "mtblspy/__init__.py:__version__",
]
bump_message = "bump: version $current_version -> $new_version"
update_changelog_on_bump = true

[tool.ruff.lint]
extend-select = ["E4", "E7", "E9", "F", "I", "G", "SLF", "PTH", "Q", "T"]
ignore = [ "BLE001", "RUF012", "TRY004", "TRY201", "TRY203", "TRY401", "FLY002", "SIM102"]
fixable = ["ALL"]

[tool.importlinter]
include_external_packages = true
root_packages = ["mhd_model"]
